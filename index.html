<style>/* Fuentes alojadas en la propia app (v1.15): Fredoka y Nunito (variables, recortadas a latín), Inter 400-600. Licencia OFL en fonts/. */
@font-face{font-family:'Fredoka';src:url(fonts/fredoka.woff) format('woff');font-weight:400 600;font-display:swap}
@font-face{font-family:'Nunito';src:url(fonts/nunito.woff) format('woff');font-weight:400 700;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-400.woff) format('woff');font-weight:400;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-500.woff) format('woff');font-weight:500;font-display:swap}
@font-face{font-family:'Inter';src:url(fonts/inter-600.woff) format('woff');font-weight:600 700;font-display:swap}


:root{--bg:#FFF4DC;--card:#fff;--tx:#1F2A44;--mu:#5B6683;--sh:#E8D9B5;--ln:#9DB8F2;--pill:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17203A;--card:#232F52;--tx:#F3F6FF;--mu:#B3BEDD;--sh:#0E1428;--ln:#5C74B3;--pill:#2E3C66;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17203A;--card:#232F52;--tx:#F3F6FF;--mu:#B3BEDD;--sh:#0E1428;--ln:#5C74B3;--pill:#2E3C66;color-scheme:dark}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--fd);-webkit-user-select:none;user-select:none}
.app{max-width:480px;margin:0 auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px}
.pg{flex:1;height:14px;background:var(--card);border-radius:7px;overflow:hidden}.pg i{display:block;height:100%;background:#15803D;border-radius:7px;transition:width .4s}
.st{display:flex;align-items:center;gap:4px;font-weight:500;background:var(--card);border-radius:16px;padding:6px 12px}
.ib{width:44px;height:44px;border:0;border-radius:22px;background:var(--ac);display:flex;align-items:center;justify-content:center;cursor:pointer}
.pills{display:flex;gap:6px;font-size:12px;font-weight:500;flex-wrap:wrap}
.pills span{background:var(--pill);color:var(--mu);border-radius:12px;padding:5px 10px}.pills .on{background:var(--ac);color:#fff;outline:3px solid #F59E0B}.pills .ok{background:#15803D;color:#fff}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 0 0 2px var(--bd)}
.tx{font-size:19px;line-height:1.5}.nm{font-weight:500;border-radius:6px;padding:0 4px}.nm.on{background:#FDE68A;color:#1F2A44}
.mr{display:flex;align-items:center;gap:6px;margin-bottom:10px}.lb{width:54px;font-size:14px;flex:none}
.bars{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tb{display:flex;flex-direction:column;align-items:center}.br{align-self:stretch;height:10px;margin-top:4px;border:3px solid var(--tx);border-bottom:0;border-radius:8px 8px 0 0}
.slot{height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:20px;box-sizing:border-box;border:3px dashed var(--ln);transition:transform .15s;flex:none}
.slot[data-s]{cursor:pointer}.slot:not(.em){border:0;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.slot.gp{outline:3px dashed #B45309;outline-offset:-3px}
.slot.bad{border-color:#DC2626;animation:sh .4s 2}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tray{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-width:52px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:500;font-size:20px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);touch-action:none;cursor:grab}
.chip.sel{outline:4px solid #F59E0B;outline-offset:2px}
.ghost{position:fixed;z-index:9;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) scale(1.1)}
.ex{display:flex;gap:6px;align-items:center;font-weight:600;font-size:22px;flex-wrap:wrap}
.bub{display:flex;align-items:center;gap:10px}.bub p{flex:1;margin:0;background:var(--card);border-radius:18px;padding:10px 14px;font-size:15px;line-height:1.4;font-weight:500}
.bt{height:54px;border:0;border-radius:27px;font-family:inherit;font-weight:500;font-size:16px;cursor:pointer;padding:0 20px;color:#fff;background:#16A34A;box-shadow:none}
.bt.o{background:#F59E0B;color:#1F2A44;box-shadow:none}.bt.g{background:var(--card);color:var(--tx);box-shadow:0 0 0 2px var(--bd)}
.acts{display:flex;gap:10px}.acts .bt{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{height:50px;border:0;border-radius:14px;font-family:inherit;font-size:22px;font-weight:500;background:var(--pill);color:var(--tx);cursor:pointer}
.ans{font-size:26px;font-weight:600;text-align:center}
.win{text-align:center;font-weight:600;font-size:22px}.win svg{animation:pop .6s both}.win svg:nth-child(2){animation-delay:.15s}.win svg:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

.ttl{flex:1;font-weight:600;font-size:26px}.wm{font-weight:600;font-size:30px;color:var(--acx);letter-spacing:-1px}.ib.g{background:var(--card);color:var(--tx);font-size:24px;font-family:inherit;font-weight:600}
.nav{border:0;border-radius:28px;padding:18px;text-align:left;font-family:inherit;font-weight:600;font-size:22px;cursor:pointer;color:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.22)}.nav small{font-size:13px;font-weight:500}

if(!tx||(w!==6&&(r[6]==null||r[6]===""||r[7]==null||r[7]===""||isNaN(a)||isNaN(b)))||![1,2,3].includes(l))throw Error("faltan datos");
const nm=/^(\S+) tiene .* y (\S+) tiene/.exec(tx),n1=nm?nm[1]:tx.split(" ")[0],n2=nm?nm[2]:null;let rows=null,tot,val,fr,nn=null,opn=null;
if(w===6){rows=[];const cv=v=>v.trim()==="?"?"?":+v;for(const part of String(r[11]||"").split(";").map(x=>x.trim()).filter(Boolean)){const i=part.indexOf(":");if(i<0)throw Error("modelo no válido");const lab=part.slice(0,i).trim(),rest=part.slice(i+1);if(lab.toUpperCase()==="TOTAL"){tot=cv(rest);continue}const[bl,tt]=rest.split("=");const rw={l:lab,s:bl.split(",").map(cv)};if(tt&&tt.trim())rw.t=cv(tt);if(rw.s.some(x=>x!=="?"&&isNaN(x)))throw Error("modelo no válido");rows.push(rw)}if(!rows.length)throw Error("modelo no válido");val=+r[9];const L=op.split(";").filter(x=>x.trim());nn=2*L.length+1;opn=[...new Set(L.flatMap(x=>(x.split("=")[0].match(/\d+/g)||[]).map(Number)))].sort((x,y)=>x-y)}
else if(w===1){rows=[{l:"Partes",s:t===0?[a,b]:[b,"?"]}];if(t===0){tot="?";val=a+b}else{tot=a;val=a-b}}
else if(w===2){if(!n2)throw Error("no encuentro los nombres");if(t===0){rows=[{l:n1,s:[a]},{l:n2,s:[a,b],t:"?"}];val=a+b}else if(t===1){rows=[{l:n1,s:[a]},{l:n2,s:["?",{v:b,g:1}]}];val=a-b}else if(t===2){rows=[{l:n1,s:[b,"?"],t:a},{l:n2,s:[b]}];val=a-b}else{rows=[{l:n1,s:[a]},{l:n2,s:[a,b]}];tot="?";val=2*a+b}}
else if(w===3){if(c==null||isNaN(c))throw Error("falta el Dato 3");const d=b,k=c;if(!(d>0)||!(k>0))throw Error("el denominador y el numerador deben ser mayores que 0");if(t===3?a%k:a%d)throw Error("el total no se reparte en partes iguales");rows=[{l:"Partes",s:[]}];if(t===0){fr={d,k,g1:"?"};tot=a;val=Math.floor(a/d)*k;nn=5}else if(t===1){fr={d,k,g2:"?"};tot=a;val=a-Math.floor(a/d)*k;nn=7}else if(t===2){fr={d,k:1,g2:"?"};tot=a;val=a-Math.floor(a/d);nn=5}else{fr={d,k,g1:a};tot="?";val=Math.floor(a/k)*d;nn=5}}
else if(w===5){if(c==null||isNaN(c)||!(c>0))throw Error("falta el Dato 3");if(t===0){const q=/^Entre (\S+) y (\S+) tienen/.exec(tx);if(!q)throw Error("no encuentro los nombres");if((a-b)%2)throw Error("el resultado no es un entero positivo");rows=[{l:q[2],s:["?"]},{l:q[1],s:["?",b]}];tot=a;val=(a-b)/2;nn=5}else if(t===1){if(!n2)throw Error("no encuentro los nombres");rows=[{l:n1,s:[b,"?","?"],t:a},{l:n2,s:[b]}];val=(a-b)/2;nn=5}else if(t===2){if(a%b||(a-a/b)%c)throw Error("el total no se reparte en partes iguales");const x=a/b,y=(a-x)/c;rows=[{l:"Partes",s:c===2?[x,"?","?"]:[x,y,"?"]}];tot=a;val=a-x-y;nn=c===2?7:9}else return null}
else if(w===4&&b>=1&&b<=6&&t<3){if(t===0){rows=[{l:"Grupos",s:Array(b).fill(a)}];tot="?";val=a*b}else if(t===1){if(a%b)throw Error("el total no se reparte en partes iguales");rows=[{l:"Cajas",s:Array(b).fill("?")}];tot=a;val=a/b}else{const q=/de ([^\s.]+)\./.exec(tx);if(!q)throw Error("no encuentro el nombre");rows=[{l:q[1],s:[a]},{l:n1,s:Array(b).fill(a)}];tot="?";val=a*(b+1)}}
else return null;
if(!(val>0)||val!==Math.floor(val))throw Error("el resultado no es un entero positivo");

[tot,...rows.map(rw=>rw.t),...(fr?[fr.g1,fr.g2]:[])].forEach(x=>{if(typeof x==="number")nums.add(x)});
let xd=[];if(+mm[2]>=25&&w<=4){const kn=new Set([...nums,a,b,...(w===3&&c?[c]:[])]);xd=[...new Set((tx.match(/(?<![\d/])\d+(?![\d/])/g)||[]).map(Number))].filter(x=>!kn.has(x)).sort((x,y)=>x-y)}
const dd=nums.has(val+1)?val+2:val+1,p={id,w,l,t:tx,rows,ans:val,tray:[...new Set([...nums,...xd])].sort((x,y)=>x-y).concat(["?",dd]),ops:(opn||[...new Set([a,b,...(w===3||w===5?[c]:[]),...xd])].sort((x,y)=>x-y)).concat(["+","−","×","÷"]),n:nn||((w===2&&t===3)||(w===4&&t===2)?5:3),h:[h1,h2,"Prueba con: "+op.replace(/[()]/g,"")]};

async function importX(f){if(!f)return;const m=document.getElementById("xmsg");try{if(!window.DecompressionStream)throw Error("Este navegador no puede leer Excel; actualízalo");const buf=await f.arrayBuffer(),rows=(await readXlsx(buf)).slice(1).filter(r=>r&&r[0]),out=[],bad=[];let skip=0;
rows.forEach(r=>{try{const p=mkProb(r);if(p)out.push(p);else skip++}catch(e){bad.push(r[0]+" ("+e.message+")")}});
if(!out.length)throw Error("No se encontró ningún problema válido");
let s="";const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
st.bank=out;st.bankFile=btoa(s);DATA.problems=out;save();XMSG=out.length+" problemas importados"+(skip?" · "+skip+" filas sin modelo de barras ignoradas (p. ej. más de 6 bloques iguales)":"")+(bad.length?". Revisa estas filas: "+bad.slice(0,5).join("; ")+(bad.length>5?"…":""):".");go("tutor",{tab:"c"})}catch(e){XMSG="No se pudo importar: "+e.message;go("tutor",{tab:"c"})}}
