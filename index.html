<style>

html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}

.app{max-width:480px;margin:0 auto;padding:14px 16px 24px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:10px}

.st{display:flex;align-items:center;gap:4px;font-weight:700;background:var(--card);border-radius:16px;padding:6px 12px}

.pills{display:flex;gap:6px;font-size:12px;font-weight:600;flex-wrap:wrap}
.pills span{background:var(--pill);color:var(--mu);border-radius:12px;padding:5px 10px}.pills .on{background:#2563EB;color:#fff;outline:3px solid #F59E0B}.pills .ok{background:#15803D;color:#fff}
.card{background:var(--card);border-radius:24px;padding:16px;box-shadow:0 4px 0 var(--sh)}
.tx{font-size:19px;line-height:1.5}.nm{font-weight:700;border-radius:6px;padding:0 4px}.nm.on{background:#FDE68A;color:#1F2A44}
.mr{display:flex;align-items:center;gap:6px;margin-bottom:10px}.lb{width:54px;font-size:14px;flex:none}
.bars{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.tb{display:flex;flex-direction:column;align-items:center}.br{align-self:stretch;height:10px;margin-top:4px;border:3px solid var(--tx);border-bottom:0;border-radius:8px 8px 0 0}
.slot{height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;box-sizing:border-box;border:3px dashed var(--ln);transition:transform .15s;flex:none}
.slot[data-s]{cursor:pointer}.slot:not(.em){border:0;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2)}
.slot.gp{outline:3px dashed #B45309;outline-offset:-3px}
.slot.bad{border-color:#DC2626;animation:sh .4s 2}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.tray{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{min-width:52px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:20px;box-shadow:inset 0 -5px 0 rgba(0,0,0,.2);touch-action:none;cursor:grab}
.chip.sel{outline:4px solid #F59E0B;outline-offset:2px}
.ghost{position:fixed;z-index:9;pointer-events:none;opacity:.9;transform:translate(-50%,-50%) scale(1.1)}
.ex{display:flex;gap:6px;align-items:center;font-weight:800;font-size:22px;flex-wrap:wrap}
.bub{display:flex;align-items:center;gap:10px}.bub p{flex:1;margin:0;background:var(--card);border-radius:18px;padding:10px 14px;font-size:15px;line-height:1.4;font-weight:600}
.bt{height:54px;border:0;border-radius:27px;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;padding:0 20px;color:#fff;background:#16A34A;box-shadow:0 4px 0 #0F6B31}
.bt.o{background:#F59E0B;color:#1F2A44;box-shadow:0 4px 0 #C97F00}.bt.g{background:var(--card);color:var(--tx);box-shadow:0 4px 0 var(--sh)}
.acts{display:flex;gap:10px}.acts .bt{flex:1}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pad button{height:50px;border:0;border-radius:14px;font-family:inherit;font-size:22px;font-weight:700;background:var(--pill);color:var(--tx);cursor:pointer}
.ans{font-size:26px;font-weight:800;text-align:center}
.win{text-align:center;font-weight:800;font-size:22px}.win svg{animation:pop .6s both}.win svg:nth-child(2){animation-delay:.15s}.win svg:nth-child(3){animation-delay:.3s}
@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}

.ttl{flex:1;font-weight:800;font-size:26px}.wm{font-weight:800;font-size:30px;color:#2563EB;letter-spacing:-1px}.ib.g{background:var(--card);color:var(--tx);font-size:24px;font-family:inherit;font-weight:800}
.nav{border:0;border-radius:28px;padding:18px;text-align:left;font-family:inherit;font-weight:800;font-size:22px;cursor:pointer;color:#fff;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.22)}.nav small{font-size:13px;font-weight:600}
.row2{display:flex;gap:12px}.row2>*{flex:1}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{border:0;border-radius:16px;padding:8px 12px;font:700 13px inherit;font-family:inherit;background:var(--card);color:var(--mu);cursor:pointer}.tabs .on{background:#2563EB;color:#fff}
.lv{display:flex;flex-direction:column;gap:10px}.dots{display:flex;gap:8px}.dots i{width:22px;height:22px;border-radius:11px;background:#E5ECFA;display:block}.dots i.f{background:#15803D}
.bds{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.bdg{background:var(--card);border-radius:20px;padding:12px 6px;box-shadow:0 3px 0 var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;font-weight:700}
.bdg .c{width:62px;height:62px;border-radius:31px;display:flex;align-items:center;justify-content:center}.bdg.no{opacity:.75}.bdg.no .c{background:#D5DBEA;border:3px dashed #9AA5C2;box-sizing:border-box}
.mut{font-size:13px;color:var(--mu);font-weight:600}.bar{height:14px;background:#E5ECFA;border-radius:7px;overflow:hidden;flex:1}.bar i{display:block;height:100%;border-radius:7px}
.in{font:600 16px inherit;font-family:inherit;border:2px solid var(--ln);border-radius:12px;padding:10px;background:var(--card);color:var(--tx);width:100%;box-sizing:border-box}
.gate{font-weight:800;font-size:38px;text-align:center}.pad.g button{height:56px}
.cell{height:46px;border-radius:8px;background:var(--pill);border:2px solid var(--ln);box-sizing:border-box;flex:none}.cell[data-c]{cursor:pointer}.cell.sh{background:#F59E0B;border-color:#C97F00}

:root{--bd:#CBD5E1;--soft:#EEF3FA;--seg:#D9E1EC;--warnbg:#FBF3DF;--fd:'Fredoka','Nunito',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bd:#3A4C7A;--soft:#1D2848;--seg:#1B2542;--warnbg:#3A3320}}
:root[data-theme="dark"]{--bd:#3A4C7A;--soft:#1D2848;--seg:#1B2542;--warnbg:#3A3320}
body{font-family:'Nunito',system-ui,sans-serif}.app{padding-top:18px;gap:14px}
h2,h3,.wm,.hi,.ttl,.bt,.chip,.slot,.nav,.st,.ans,.gate{font-family:var(--fd)}
.slot[data-s]{touch-action:none}
.hd,.ih{display:flex;align-items:center;justify-content:space-between}.brand,.hr,.who,.gr{display:flex;align-items:center;gap:10px}.wm{font-size:1.9rem;font-weight:700;letter-spacing:-.5px}
.av{width:46px;height:46px;border-radius:50%;border:0;background:#2563EB;color:#fff;font:700 1.1rem var(--fd);cursor:pointer;box-shadow:0 3px 8px rgba(0,0,0,.12)}.av.big{width:58px;height:58px;font-size:1.5rem}
.pill{display:flex;align-items:center;gap:6px;height:46px;padding:0 16px;border-radius:23px;background:#F59E0B;color:#1F2A44;font:700 1.15rem var(--fd)}
.rnd{width:46px;height:46px;border-radius:50%;border:2.5px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center}
.gr{justify-content:center;margin:4px 0}.hi{font-size:2rem;font-weight:700;margin:0;line-height:1.1}
.lc{display:flex;align-items:center;gap:16px;width:100%;text-align:left;padding:18px 20px;border-radius:32px;border:3px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;font-family:inherit;transition:transform .08s}.lc:active,.hc:active,.sb:active{transform:scale(.98)}
.lc .ico{width:60px;height:60px;border-radius:18px;background:#DBEAFE;display:flex;align-items:center;justify-content:center;flex:none;color:#2563EB}
.lc .tx2{flex:1;display:flex;flex-direction:column}.lc b{font:700 1.35rem var(--fd)}.lc small{font-size:.95rem;color:var(--mu);font-weight:600}

.tut{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px;border-radius:30px;border:3px dashed var(--bd);background:transparent;color:var(--mu);font:700 1.1rem var(--fd);cursor:pointer}
.back{border:0;background:none;color:#2563EB;font:700 1.15rem var(--fd);cursor:pointer;padding:8px 0}.ttl2{font:700 1.8rem var(--fd);margin:0}
.seg3{display:flex;gap:4px;padding:6px;border-radius:30px;background:var(--seg)}.seg3 button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;color:var(--tx);font:700 .85rem Nunito;padding:10px 4px;border-radius:24px;cursor:pointer}.seg3 .on{background:var(--card);box-shadow:0 2px 8px rgba(0,0,0,.1)}

.sel{display:flex;gap:10px}.sel select,.sel input{flex:1;min-width:0;border:2.5px solid var(--bd);background:var(--soft);color:var(--tx);border-radius:20px;padding:14px;font:600 1rem Nunito}
.sb{border:2.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:22px;padding:0 20px;font:700 1rem var(--fd);cursor:pointer;min-height:48px}.sb.p{background:#2563EB;border-color:#2563EB;color:#fff}.sb.d{background:#FEE2E2;border-color:#FCA5A5;color:#B91C1C}
.lab{text-transform:uppercase;letter-spacing:.08em;font:700 .85rem Nunito;color:var(--mu);margin-top:6px}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.sc{border:3px solid var(--bd);background:var(--card);border-radius:24px;padding:14px}.sc b{display:block;font:700 1.6rem var(--fd)}.sc small{color:var(--mu);font-weight:600}.sc svg{color:#2563EB}
.wk{display:flex;gap:6px;align-items:flex-end;height:110px}.wk div{flex:1;text-align:center;font-size:.8rem;color:var(--mu);display:flex;flex-direction:column;justify-content:flex-end}.wk i{display:block;width:100%;background:#2563EB;border-radius:8px;margin-bottom:4px}
.note{background:#FEF3C7;color:#1F2A44;border-radius:20px;padding:12px 16px;font-weight:700}.warn{background:var(--warnbg);border:3px solid #F5D08A;border-radius:28px;padding:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.cp{border:2px solid #F5D08A;border-radius:999px;padding:8px 14px;font-weight:700}.tile{width:64px;height:64px;border-radius:18px;background:#2563EB;color:#fff;font:700 1.6rem var(--fd);display:flex;align-items:center;justify-content:center;flex:none}

.blk{display:flex;align-items:center;flex:none}.blk .slot{flex:none}.rz{width:14px;height:46px;flex:none;background:var(--ln);border-radius:0 10px 10px 0;cursor:ew-resize;touch-action:none;position:relative}.rz:after{content:"";position:absolute;left:5px;top:14px;width:4px;height:18px;border-left:2px solid var(--card);border-right:2px solid var(--card)}
.pm{display:flex;gap:4px}.pm button,.stp button{width:38px;height:46px;border-radius:12px;border:2px solid var(--bd);background:var(--card);color:var(--tx);font:700 1.2rem var(--fd);cursor:pointer}.stp{display:flex;align-items:center;gap:8px;margin-bottom:10px}.stp b{min-width:28px;text-align:center;font:700 1.2rem var(--fd)}
.vb2{display:flex;align-items:stretch;gap:6px}.vb2 .rws{flex:1;min-width:0}.vbr{display:flex;align-items:center;gap:6px;padding-bottom:10px}.brc{align-self:stretch;width:12px;border:3px solid var(--tx);border-left:0;border-radius:0 12px 12px 0;margin-bottom:0}
.slot.pop{animation:pp .5s ease}@keyframes pp{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.slot.pop{animation:none}}
.ld i{width:12px!important;height:12px!important;border-radius:6px!important}

.gr .mas{animation:mfloat 3.4s ease-in-out infinite alternate;transform-origin:50% 90%;overflow:visible}
.gr .eyes{animation:mblink 5.5s infinite;transform-box:fill-box;transform-origin:50% 50%}
.gr .ten{animation:msway 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
@keyframes mfloat{from{transform:translateY(0) rotate(-1.5deg)}to{transform:translateY(-5px) rotate(1.5deg)}}
@keyframes mblink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.12)}}
@keyframes msway{from{transform:skewX(-5deg)}to{transform:skewX(5deg)}}
@media (prefers-reduced-motion:reduce){.gr .mas,.gr .eyes,.gr .ten{animation:none}}

</style>

const IO={play:'<path d="M8 5v14l11-7z" fill="currentColor" stroke="none"/>',learn:'<path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11.5V16c3 2.5 9 2.5 12 0v-4.5"/>',refresh:'<path d="M20 11a8 8 0 00-14-4l-2 2M4 13a8 8 0 0014 4l2-2"/><path d="M4 4v5h5M20 20v-5h-5"/>',album:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="2"/><path d="M21 16l-5-5-9 9"/>',map:'<path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2zM9 4v14M15 6v14"/>',lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',chev:'<path d="M9 5l7 7-7 7"/>',chart:'<path d="M6 20v-6M12 20V6M18 20v-9"/>',sliders:'<path d="M4 6h8M18 6h2M4 12h2M12 12h8M4 18h10M20 18h0"/><circle cx="15" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="18" r="2"/>',user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',cal:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',bolt:'<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',star:'<path d="M12 2l3 6.5 7 .8-5.2 4.8 1.5 7-6.3-3.6-6.3 3.6 1.5-7L2 9.3l7-.8z" fill="currentColor"/>',award:'<circle cx="12" cy="9" r="6"/><path d="M8 14l-2 8 6-3 6 3-2-8"/>',book:'<path d="M3 5h7a2 2 0 012 2v13a2 2 0 00-2-2H3zM21 5h-7a2 2 0 00-2 2v13a2 2 0 012-2h7z"/>',moon:'<path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 0010.5 10.5z"/>'};
const ic=(n,s=26)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IO[n]}</svg>`;
const bar=()=>`<div class="hd"><div class="brand">${logo(46)}<span class="wm">Barri</span></div><div class="hr"><button class="av" data-go="gate" aria-label="Zona del tutor">${(st.name||"B")[0].toUpperCase()}</button><div class="pill">${ic("star",20)}${st.stars}</div><button class="rnd" data-act="theme" aria-label="Cambiar tema">${ic("moon",22)}</button></div></div>`;
const ih=(to,t)=>`<div class="ih"><button class="back" data-go="${to}">← ${t}</button><button class="rnd" data-go="home" aria-label="Cerrar">✕</button></div>`;
const lc=(cls,i,t,s,at)=>`<button class="lc ${cls}" ${at}><span class="ico">${ic(i,34)}</span><span class="tx2"><b>${t}</b><small>${s}</small></span>${ic("chev",26)}</button>`;
const dots=(n,m)=>`<div class="dots">${Array.from({length:m},(_,i)=>`<i class="${i<n?"f":""}"></i>`).join("")}</div>`;
const sc=(i,v,l)=>`<div class="sc">${ic(i,26)}<b>${v}</b><small>${l}</small></div>`;
const bubs=t=>`<div class="bub">${mas(64)}<p>${t}</p></div>`;
const minsToday=()=>{const t=new Date().setHours(0,0,0,0);return Math.round(st.log.filter(x=>x.ts>=t).reduce((s,x)=>s+(x.dt||0),0)/6e4)};
function wk(){const m=[0,0,0,0,0,0,0],d=new Date(),mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-(d.getDay()+6)%7).getTime();st.log.forEach(x=>{const i=Math.floor((x.ts-mon)/864e5);if(x.ts>=mon&&i<7)m[i]+=(x.dt||0)/6e4});return m}
function review(){const l={};st.log.forEach(x=>l[x.id]=x);return Object.values(l).filter(x=>x.errs>0).map(x=>(x.id.endsWith("d")?pool(x.w,4):DATA.problems).find(p=>p.id===x.id)).filter(Boolean)}
const dl=(n,t,ty)=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type:ty}));a.download=n;a.click()};
const NM=["","Modelo casi hecho","Completa el modelo","Construye tú","Dibuja tú"];
let scr="home",cx={},before=[];
const TB={
p(){const[w,l]=nextLv(),tot=DATA.problems.length,sv=Object.keys(st.solved).length,L=st.log,wm=wk(),mx=Math.max(1,...wm),t=tiers(),rv=review().length,E={em:"Coloca bloques que no encajan en el modelo",eo:"Arma una operación que no coincide con el modelo",ea:"Se equivoca al escribir el resultado"},
hard=[1,2,3,4].map(w=>{const X=L.filter(x=>x.w===w);return[w,X.length,X.length?Math.round(X.filter(x=>!x.errs).length/X.length*100):100]}).filter(a=>a[1]>=3&&a[2]<75),
er=Object.keys(E).map(k=>[E[k],L.reduce((s,x)=>s+(x[k]||0),0)]).filter(e=>e[1]).sort((a,b)=>b[1]-a[1]);
return `<div class="sec" style="flex-direction:row;align-items:center;gap:16px"><div class="tile">N${l}</div><div style="flex:1"><span class="mut">Nivel actual</span><h3>${WN[w]} · nivel ${l}</h3><div class="bar" style="margin:8px 0"><i style="width:${Math.round(sv/tot*100)}%;background:#2563EB"></i></div><span class="mut">${sv} de ${tot} problemas resueltos</span></div></div>
<div class="warn"><b>Le cuesta</b> <span class="mut">· para reforzar</span><div class="chips">${hard.length?hard.map(a=>`<span class="cp">${WN[a[0]]} · ${a[2]}%</span>`).join(""):'<span class="mut">Sin dificultades por ahora</span>'}</div><p class="mut" style="margin:0">Son señales del juego para observar y reforzar, no un diagnóstico.</p></div>
<div class="sec" style="flex-direction:row;align-items:center"><div style="flex:1"><h3>${rv} repasos pendientes</h3><span class="mut">Problemas con errores</span></div><button class="sb" data-rev="1">Repasar</button></div>
<div class="lab">Actividad</div><div class="stats3">${sc("clock",minsToday()+" min","Hoy")}${sc("cal",Math.round(wm.reduce((s,x)=>s+x,0))+" min","Esta semana")}${sc("bolt",streak()+" días","Racha")}${sc("star",st.stars,"Estrellas")}${sc("award",t.filter(b=>b.lv).length,"Insignias")}${sc("book",L.length,"Problemas jugados")}</div>
<div class="sec"><h3>Uso esta semana <span class="mut" style="font:600 .9rem Nunito">(minutos)</span></h3><div class="wk">${wm.map((m,i)=>`<div><i style="height:${Math.max(6,m/mx*80)}px"></i>${"LMXJVSD"[i]}</div>`).join("")}</div></div>
<div class="sec"><h3>Errores frecuentes</h3>${er.map(e=>`<div class="note">${e[0]} (${e[1]} veces)</div>`).join("")||'<span class="mut">Sin errores registrados</span>'}</div>
<div class="sec"><h3>Álbum</h3><span class="mut">${t.filter(b=>b.lv).length} de ${BD.length} insignias</span><div class="chips">${t.filter(b=>b.lv).map(b=>`<span class="cp">${b.n} · ${TN[b.lv]}</span>`).join("")||'<span class="mut">Aún sin insignias</span>'}</div></div>
<button class="sb" data-act="csv">Descargar informe (CSV)</button>`},
c(){const vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>v.lang.startsWith("es"));return `<div class="sec"><h3>Sesión</h3><span class="mut">Duración diaria</span><div class="sel"><select id="dur">${[10,15,20,30].map(m=>`<option value="${m}"${m===st.set.dur?" selected":""}>${m} minutos</option>`).join("")}</select><button class="sb" data-act="dur">Aplicar</button></div><span class="mut">Al llegar al tiempo, Barri sugiere descansar, sin bloquear el juego.</span></div>
<div class="sec"><h3>Audio</h3><span class="mut">Voz del dispositivo</span><div class="sel"><select id="vo"><option value="">Predeterminada</option>${vs.map(v=>`<option${v.name===st.set.voice?" selected":""}>${v.name}</option>`).join("")}</select><button class="sb" data-act="voice">Aplicar</button></div><button class="sb" data-act="vtest">Probar voz</button></div>`},
s(){return `<div class="sec"><h3>Perfil</h3><div class="sel"><input id="nm" value="${st.name}" placeholder="Nombre del alumno"><button class="sb" data-act="rename">Renombrar</button></div><div class="sel"><button class="sb d" style="flex:1" data-act="reset">Reiniciar</button><button class="sb d" style="flex:1" data-act="wipe">Borrar</button></div></div>
<div class="sec"><h3>Copias de seguridad</h3><div class="sel"><button class="sb p" style="flex:1" data-act="save">Guardar copia</button><button class="sb" style="flex:1" data-act="restore">Restaurar copia</button></div><input type="file" id="rf" accept=".json" hidden></div>
<div class="sec"><h3>Sistema</h3><span>Barri · versión <b>${VER}</b></span><div class="sel"><button class="sb" style="flex:1" data-act="upd">Buscar actualización</button><button class="sb p" style="flex:1" data-act="updnow">Actualizar ahora</button></div></div>`}};
let LT=null,LS={k:0,f:[],play:true,snd:false,p:null};
function initLesson(w){const p=pool(w,1)[0],x=s=>typeof s==="object"?s.v:s;LS={k:0,f:[],play:true,snd:LS.snd,p};clearInterval(LT);if(!p)return;const f=[],keys=[];
f.push({t:"Lee el problema y busca los datos."});
if(p.fr){const F=p.fr;f.push({t:`La barra se divide en ${F.d} partes iguales.`,sh:0});for(let i=0;i<F.k;i++)f.push({t:`Sombreamos la parte ${i+1} de ${F.k}.`,sh:i+1});
[["t",p.tot,"La llave marca el total"],["g1",F.g1,"Las partes sombreadas valen"],["g2",F.g2,"El resto vale"]].forEach(([k,v,t])=>{if(v!==undefined)keys.push({k,t:`${t}: ${v==="?"?"lo que buscamos (?)":v}.`})})}
else{p.rows.forEach((r,ri)=>{r.s.forEach((s,si)=>keys.push({k:ri+"."+si,t:x(s)==="?"?`En la barra de ${r.l}, este hueco es lo que buscamos: el ?.`:`En la barra de ${r.l} ponemos ${x(s)}.`}));if(r.t!==undefined)keys.push({k:ri+".t",t:`Aquí va el total de ${r.l}${r.t==="?"?": lo que buscamos":""}.`})});if(p.tot!==undefined)keys.push({k:"t",t:`La llave marca el total${p.tot==="?"?": lo que buscamos (?)":": "+p.tot}.`})}
const all=keys.map(o=>o.k),sh=p.fr?p.fr.k:0;f.forEach(fr=>{fr.hid=all});keys.forEach((o,i)=>f.push({t:o.t,lk:o.k,hid:all.slice(i+1),sh}));
f.push({t:`Ahora la operación: ${p.h[2].replace("Prueba con: ","")}.`,op:1,hid:[],sh},{t:`El resultado es ${p.ans}. El ? encaja en el modelo.`,op:1,done:1,hid:[],sh});
LS.f=f;LT=setInterval(()=>{if(scr!=="les")return;if(LS.play&&LS.k<LS.f.length-1){LS.k++;show();if(LS.snd)say(LS.f[LS.k].t)}else if(LS.play&&LS.k>=LS.f.length-1){LS.play=false;show()}},2600)}
const SC={
home(){const[w,l]=nextLv(),rv=review().length,mt=minsToday();return bar()+`<div class="gr">${mas(96)}<div><h2 class="hi">¡Hola${st.name?", "+st.name:""}!</h2><p class="mut" style="margin:4px 0 0;font-size:1rem">¿Seguimos aprendiendo?</p></div></div>`+(mt>=st.set.dur?`<div class="note">Hoy ya llevas ${mt} minutos. ¡Buen trabajo, descansa un poco!</div>`:"")+lc("hero","play","Aventuras",`Seguimos con ${WN[w]}, nivel ${l}`,`data-play="${w},${l}"`)+lc("","learn","Aprender","Cómo funcionan las barras",'data-go="learn"')+lc("","refresh","Repasar",rv?rv+" problemas por repasar":"Nada por repasar",rv?'data-rev="1"':'data-go="adv"')+`<div class="row2"><button class="hc" data-go="album">${ic("album",28)}Mi álbum</button><button class="hc" data-go="adv">${ic("map",28)}Mapa de mundos</button></div><button class="tut" data-go="gate">${ic("lock",22)}Zona del tutor</button>`},
learn(){return ih("home","Inicio")+'<h2 class="ttl2">Aprender</h2>'+[1,2,3,4].map(w=>lc("","learn",WN[w],pool(w,1).length?"Ver cómo se hace":"En preparación",`data-go="les" data-w="${w}"`)).join("")},
les(){const w=cx.w,p=LS.p;if(!p)return ih("learn","Aprender")+`<h2 class="ttl2">${WN[w]}</h2><div class="card tx">${EX[w]}</div>`;const fr=LS.f[LS.k],op=p.h[2].replace("Prueba con: ","");S.fill={};S.sh={};S.done=!!fr.done;S.bad={};S.lh={};(fr.hid||[]).forEach(k=>S.lh[k]=1);S.lk=fr.lk||null;for(let i=0;i<(fr.sh||0);i++)S.sh[i]=true;
return ih("learn","Aprender")+`<h2 class="ttl2">${WN[w]}</h2><div class="card tx">${p.t}</div><div class="card">${model(p,false)}</div>`+(fr.op?`<div class="ex">${op}${fr.done?" = "+p.ans:""}</div>`:"")+bubs(fr.t)+`<div class="dots ld" style="justify-content:center">${LS.f.map((_,i)=>`<i class="${i<=LS.k?"f":""}"></i>`).join("")}</div><div class="row2"><button class="sb" data-l="prev" aria-label="Anterior">⏮</button><button class="sb p" data-l="play" aria-label="Reproducir o pausar">${LS.play?"⏸":"▶"}</button><button class="sb" data-l="next" aria-label="Siguiente">⏭</button><button class="sb" data-l="snd" aria-label="Voz">${LS.snd?"🔊":"🔈"}</button></div><button class="bt" data-play="${w},1">Probar yo</button>`},
adv(){const w=cx.w||nextLv()[0];return ih("home","Inicio")+'<h2 class="ttl2">Mapa de mundos</h2><div class="tabs">'+[1,2,3,4].map(x=>`<button class="${x===w?"on":""}" data-go="adv" data-w="${x}">${WN[x]}</button>`).join("")+'</div>'+[1,2,3,4].map(l=>{const o=open(w,l),n=pool(w,l).length;return `<div class="sec" style="${o?"":"opacity:.6"}"><h3>Nivel ${l} · ${NM[l]}</h3><span class="mut">${n?(o?cnt(w,l)+" de "+n+" resueltos":"Se abre al resolver "+need(w,l-1)+" del nivel "+(l-1)):"En preparación"}</span>${dots(Math.min(5,cnt(w,l)),5)}${o?`<button class="sb p" style="min-height:52px" data-play="${w},${l}">Jugar nivel ${l}</button>`:""}</div>`}).join("")},
album(){const t=tiers();return ih("home","Inicio")+`<h2 class="ttl2">Mi álbum</h2>`+bubs(t.filter(b=>b.lv).length+" de "+BD.length+" insignias")+`<div class="bds">${t.map(bdg).join("")}</div><div class="lab">Accesorios de Bloquito</div><div class="row2">${ACC.map(a=>`<button class="hc" style="justify-content:center;flex-direction:column;gap:2px;${st.acc===a[0]?"outline:3px solid #F59E0B;":""}${st.stars<a[2]?"opacity:.5;":""}" data-eq="${a[0]}">${a[1]}<small class="mut">${st.stars>=a[2]?(st.acc===a[0]?"Puesto":"Tuyo"):a[2]+" estrellas"}</small></button>`).join("")}</div>`},
nb(){return `<div class="card win"><div style="font-size:26px;color:#B45309">¡Nueva insignia!</div>${cx.list.map(bdg).join("")}</div><button class="bt" data-go="home">Seguir</button>`},
gate(){const q=cx.q||(cx.q={a:6+Math.floor(Math.random()*4),b:6+Math.floor(Math.random()*4),v:""});return ih("home","Inicio")+'<h2 class="ttl2">Zona del tutor</h2><p class="mut" style="text-align:center">Para entrar, resuelve la operación</p><div class="gate">'+q.a+" × "+q.b+" = "+(q.v||"…")+'</div><div class="pad g">'+[1,2,3,4,5,6,7,8,9].map(d=>`<button data-g="${d}">${d}</button>`).join("")+'<button data-g="b">⌫</button><button data-g="0">0</button><button data-g="ok" style="background:#2563EB;color:#fff">OK</button></div>'},
tutor(){const t=cx.tab||"p";return ih("home","Inicio")+`<div class="who"><div class="av big">${(st.name||"B")[0].toUpperCase()}</div><div><h2 class="hi" style="font-size:1.7rem">${st.name||"Alumno"}</h2><span class="mut">Zona del tutor</span></div></div><div class="seg3">${[["p","chart","Progreso"],["c","sliders","Configuración"],["s","user","Perfil y sistema"]].map(a=>`<button class="${t===a[0]?"on":""}" data-tab="${a[0]}">${ic(a[1],24)}<span>${a[2]}</span></button>`).join("")}</div>`+TB[t]()}};
function show(){document.getElementById("app").innerHTML=SC[scr]()}
function go(s,c){clearInterval(LT);S.lh=null;S.lk=null;scr=s;cx=c||{};if(s==="les")initLesson(cx.w);show();window.scrollTo(0,0)}
function startList(l){before=tiers().map(b=>b.lv);startGame(l)}
function play(w,l){const p=pool(w,l);if(!p.length)return;startList(p.filter(x=>!st.solved[x.id]).concat(p.filter(x=>st.solved[x.id])).slice(0,5))}
const Game={done(r){if(!st.solved[r.id]){st.solved[r.id]=r.pst;st.stars+=r.pst}st.log.push({...r,ts:Date.now()});st.log=st.log.slice(-500);const d=day(new Date());if(!st.days.includes(d))st.days.push(d);save()},
exit(){const nw=tiers().filter((b,i)=>b.lv>before[i]);nw.length?go("nb",{list:nw}):go("home")}};
async function upd(r){try{const g=await navigator.serviceWorker.getRegistration();if(g)await g.update()}catch(e){}if(r)location.reload();else alert("Buscando... Si hay versión nueva se aplica al pulsar Actualizar ahora (versión actual "+VER+").")}
document.addEventListener("click",e=>{if(S.on)return;const t=e.target.closest("[data-go],[data-play],[data-eq],[data-g],[data-act],[data-tab],[data-rev],[data-l]");if(!t)return;const d=t.dataset,g=i=>document.getElementById(i);
if(d.l){const q=d.l;if(q==="prev")LS.k=Math.max(0,LS.k-1);else if(q==="next")LS.k=Math.min(LS.f.length-1,LS.k+1);else if(q==="play"){if(LS.k>=LS.f.length-1)LS.k=0;LS.play=!LS.play}else LS.snd=!LS.snd;if(LS.snd&&q!=="snd"&&q!=="play")say(LS.f[LS.k].t);show();return}
if(d.play){const[w,l]=d.play.split(",").map(Number);return play(w,l)}
if(d.rev){const r=review();if(r.length)startList(r.slice(0,5));return}
if(d.tab){cx.tab=d.tab;return show()}
if(d.eq){if(st.stars>=ACC.find(a=>a[0]===d.eq)[2]){st.acc=d.eq;save();show()}return}
if(d.g){const q=cx.q;if(d.g==="b")q.v=q.v.slice(0,-1);else if(d.g==="ok"){if(+q.v===q.a*q.b)return go("tutor",{tab:"p"});q.v=""}else if(q.v.length<3)q.v+=d.g;return show()}
if(d.act){const a=d.act;
if(a==="theme"){const dk=document.documentElement.dataset.theme==="dark"||(!document.documentElement.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);st.theme=dk?"light":"dark";save();theme()}
else if(a==="dur"){st.set.dur=+g("dur").value;save();show()}
else if(a==="voice"){st.set.voice=g("vo").value;save()}
else if(a==="vtest")say("Hola, soy Bloquito. ¡Vamos a construir barras!");
else if(a==="rename"){st.name=g("nm").value.trim();save();show()}
else if(a==="reset"){if(confirm("¿Reiniciar el progreso? Se conserva el nombre.")){const n=st.name,th=st.theme;st=DEF();st.name=n;st.theme=th;save();show()}}
else if(a==="wipe"){if(confirm("¿Borrar todos los datos?")){st=DEF();save();theme();go("home")}}
else if(a==="save")dl("barri_copia.json",JSON.stringify(st),"application/json");
else if(a==="restore")g("rf").click();
else if(a==="upd")upd(false);else if(a==="updnow")upd(true);
else if(a==="csv")dl("barri_informe.csv","fecha,problema,mundo,nivel,errores,pistas,estrellas\n"+st.log.map(x=>[day(new Date(x.ts)),x.id,x.w,x.l,x.errs,x.hints,x.pst].join(",")).join("\n"),"text/csv");return}
if(d.go)go(d.go,d.w?{w:+d.w}:{})});
document.addEventListener("change",e=>{if(e.target.id==="rf"){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{st=Object.assign(DEF(),JSON.parse(r.result));save();theme();go("tutor",{tab:"s"})}catch(x){alert("Archivo no válido")}};r.readAsText(f)}});
theme();go("home");

</script>
